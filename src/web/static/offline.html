<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b4a8b">
    <title>Sensorpoint Service — offline</title>
    <style>
        :root { font-family: "Segoe UI", sans-serif; color: #19344d; background: #edf4fa; }
        body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
        main { background: #fff; border: 1px solid #cfe1f2; border-radius: 24px; box-shadow: 0 24px 60px rgba(19, 50, 78, .12); max-width: 520px; padding: 32px; }
        .mark { align-items: center; background: #0b4a8b; border-radius: 16px; color: #fff; display: flex; font-size: 24px; height: 52px; justify-content: center; width: 52px; }
        h1 { font-size: 1.4rem; margin: 20px 0 10px; }
        p { color: #607b93; line-height: 1.55; margin: 0; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">↺</div>
        <h1>Sem ligação ao servidor</h1>
        <p>Volte à aplicação quando a ligação estiver disponível. Se ficou uma cópia local por sincronizar, a aplicação permite recuperá-la ao reabrir a folha. Confirme o estado de gravação antes de fechar o trabalho; esta página não confirma que as alterações foram guardadas.</p>
    </main>
</body>
</html>
