<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Proposta para total de horas calculado mas editável</title>
  <desc id="desc">Linha de técnico com horários, total editável, indicação do cálculo original e botão para repor.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#e7eff7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b4a8b" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0b4a8b">FEATURE 2 · PROPOSTA VISUAL</text>
  <text x="64" y="98" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#19344d">O cálculo ajuda; o técnico decide</text>
  <text x="64" y="128" font-family="Segoe UI, sans-serif" font-size="16" fill="#6b7f92">A duração é preenchida automaticamente e pode ser corrigida sem perder a referência.</text>
  <g transform="translate(64 174)" filter="url(#s)">
    <rect width="1072" height="414" rx="24" fill="#fff" stroke="#d6e1ec"/>
    <text x="30" y="42" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#6b7f92">REGISTO DE TÉCNICOS E HORAS</text>
    <rect x="836" y="22" width="204" height="44" rx="22" fill="#fff" stroke="#0b4a8b"/>
    <text x="938" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b4a8b">+ Adicionar técnico</text>
    <text x="30" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6b7f92">TÉCNICO</text>
    <text x="322" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6b7f92">INÍCIO</text>
    <text x="472" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6b7f92">FIM</text>
    <text x="622" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6b7f92">TOTAL EFETIVO</text>
    <text x="872" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6b7f92">DATA</text>
    <rect x="28" y="120" width="270" height="56" rx="14" fill="#fff" stroke="#d6e1ec"/><text x="50" y="154" font-family="Segoe UI, sans-serif" font-size="16" fill="#19344d">João Freire</text><path d="M270 143l7 7 7-7" fill="none" stroke="#6b7f92" stroke-width="2"/>
    <rect x="316" y="120" width="132" height="56" rx="14" fill="#fff" stroke="#d6e1ec"/><text x="382" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#19344d">09:00</text>
    <rect x="466" y="120" width="132" height="56" rx="14" fill="#fff" stroke="#d6e1ec"/><text x="532" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#19344d">18:00</text>
    <rect x="616" y="116" width="228" height="64" rx="16" fill="#fffdf7" stroke="#d99a33" stroke-width="2"/>
    <text x="640" y="154" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#19344d">08 h 00 min</text>
    <text x="812" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#b45309">✎</text>
    <rect x="862" y="120" width="172" height="56" rx="14" fill="#fff" stroke="#d6e1ec"/><text x="948" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#19344d">10/07/2026</text>
    <g transform="translate(616 196)">
      <rect width="112" height="30" rx="15" fill="#fff3dd"/><text x="56" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a4b08">AJUSTADO</text>
      <text x="126" y="20" font-family="Segoe UI, sans-serif" font-size="14" fill="#6b7f92">Calculado: 9 h 00 min</text>
      <rect x="296" y="-2" width="128" height="34" rx="17" fill="#fff" stroke="#b9cee3"/><text x="360" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0b4a8b">↻ Usar cálculo</text>
    </g>
    <line x1="28" y1="254" x2="1044" y2="254" stroke="#d6e1ec"/>
    <g transform="translate(30 280)">
      <circle cx="22" cy="22" r="22" fill="#edf4fb"/><text x="22" y="29" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0b4a8b">i</text>
      <text x="60" y="18" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#19344d">Exemplo: 09:00–18:00 dá 9 horas automaticamente.</text>
      <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#6b7f92">O técnico altera para 8 horas por causa do almoço; novas mudanças de horário não apagam a correção sem confirmação.</text>
    </g>
  </g>
  <text x="64" y="640" font-family="Segoe UI, sans-serif" font-size="14" fill="#6b7f92">Formatos aceites: 8 · 8:00 · 8 h · 7 h 30 min</text>
  <text x="64" y="688" font-family="Segoe UI, sans-serif" font-size="13" fill="#7d90a3">Mockup de aprovação · não implementado</text>
</svg>
