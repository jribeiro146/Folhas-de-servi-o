<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Proposta para revelar a área de materiais apenas quando necessária</title>
  <desc id="desc">Comparação entre o estado inicial compacto e o estado expandido depois de selecionar Sim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b4a8b" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0b4a8b">FEATURE 1 · PROPOSTA VISUAL</text>
  <text x="64" y="96" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#19344d">Materiais só aparecem quando são necessários</text>
  <text x="64" y="126" font-family="Segoe UI, sans-serif" font-size="16" fill="#6b7f92">Controlo simples, claro e confortável em tablet ou telemóvel.</text>

  <g transform="translate(64 170)" filter="url(#shadow)">
    <rect width="500" height="390" rx="22" fill="#fff" stroke="#d6e1ec"/>
    <text x="28" y="38" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6b7f92">1 · ESTADO INICIAL</text>
    <text x="28" y="76" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#19344d">Foram utilizados materiais?</text>
    <text x="28" y="104" font-family="Segoe UI, sans-serif" font-size="15" fill="#6b7f92">A tabela fica escondida por defeito.</text>
    <rect x="28" y="136" width="444" height="58" rx="29" fill="#edf4fb"/>
    <rect x="32" y="140" width="216" height="50" rx="25" fill="#fff" stroke="#0b4a8b" stroke-width="2"/>
    <circle cx="58" cy="165" r="10" fill="#0b4a8b"/>
    <text x="80" y="171" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0b4a8b">Não</text>
    <text x="302" y="171" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#6b7f92">Sim</text>
    <rect x="28" y="228" width="444" height="104" rx="16" fill="#f8fbff" stroke="#d6e1ec" stroke-dasharray="5 5"/>
    <path d="M238 258v32m-16-16h32" stroke="#9eb0c1" stroke-width="3" stroke-linecap="round"/>
    <text x="250" y="314" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#7d90a3">Sem campos desnecessários no ecrã</text>
  </g>

  <g transform="translate(596 170)" filter="url(#shadow)">
    <rect width="540" height="470" rx="22" fill="#fff" stroke="#b9cee3"/>
    <text x="28" y="38" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0b4a8b">2 · DEPOIS DE SELECIONAR “SIM”</text>
    <text x="28" y="76" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#19344d">Materiais / artigos / peças</text>
    <rect x="330" y="28" width="182" height="44" rx="22" fill="#0b4a8b"/>
    <text x="421" y="56" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">✓ Sim, adicionar</text>
    <rect x="28" y="104" width="484" height="44" rx="12" fill="#edf4fb"/>
    <text x="48" y="132" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#6b7f92">REF.</text>
    <text x="168" y="132" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#6b7f92">DESCRIÇÃO</text>
    <text x="424" y="132" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#6b7f92">QTD.</text>
    <rect x="28" y="160" width="112" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="44" y="190" font-family="Segoe UI, sans-serif" font-size="15" fill="#19344d">BAT-12V</text>
    <rect x="152" y="160" width="248" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="168" y="190" font-family="Segoe UI, sans-serif" font-size="15" fill="#19344d">Bateria 12 V / 7 Ah</text>
    <rect x="412" y="160" width="64" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="444" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#19344d">2</text>
    <circle cx="495" cy="184" r="17" fill="#fff5f4"/><text x="495" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#b42318">×</text>
    <rect x="28" y="220" width="112" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="44" y="250" font-family="Segoe UI, sans-serif" font-size="15" fill="#9aaabb">Ref.</text>
    <rect x="152" y="220" width="248" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="168" y="250" font-family="Segoe UI, sans-serif" font-size="15" fill="#9aaabb">Descrição</text>
    <rect x="412" y="220" width="64" height="48" rx="12" fill="#fff" stroke="#d6e1ec"/><text x="444" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#9aaabb">0</text>
    <rect x="28" y="292" width="156" height="44" rx="22" fill="#fff" stroke="#0b4a8b"/>
    <text x="106" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b4a8b">+ Adicionar linha</text>
    <rect x="28" y="362" width="484" height="72" rx="15" fill="#eff8f2" stroke="#b8dfc5"/>
    <circle cx="58" cy="398" r="15" fill="#15803d"/><text x="58" y="404" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="84" y="392" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#14532d">Com materiais já guardados</text>
    <text x="84" y="414" font-family="Segoe UI, sans-serif" font-size="13" fill="#3e6b4d">a área abre automaticamente.</text>
  </g>
  <text x="64" y="688" font-family="Segoe UI, sans-serif" font-size="13" fill="#7d90a3">Mockup de aprovação · não implementado</text>
</svg>
